<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>YOMI TIME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Material Design 3 - Red Theme */
  --c-primary:         #BA1A1A;
  --c-on-primary:      #FFFFFF;
  --c-primary-ctr:     #FFDAD6;
  --c-on-primary-ctr:  #410002;
  --c-secondary-ctr:   #FFDAD6;
  --c-on-secondary-ctr:#2C1512;
  --c-surface:         #FFF8F7;
  --c-on-surface:      #201A19;
  --c-surface-var:     #F4DDDB;
  --c-on-surface-var:  #534341;
  --c-surface-ctr:     #FCEAE8;
  --c-surface-ctr-hi:  #F0DEDC;
  --c-inverse-surface: #362F2E;
  --c-inverse-on:      #FBEAE8;
  --c-outline:         #857371;
  --c-outline-var:     #D8C2BF;
  --c-error:           #BA1A1A;
  
  --r-s:   16px;
  --r-m:   24px;
  --r-l:   32px;
  --r-xl:  40px;
  --r-full:9999px;
  
  --ease-std:   cubic-bezier(0.2, 0, 0, 1);
  --ease-out:   cubic-bezier(0.05, 0.7, 0.1, 1);
}

*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html { height: 100%; }
body {
  background: var(--c-surface); color: var(--c-on-surface);
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
body.mourning { filter: grayscale(1) contrast(0.95); }

/* ── LAYOUT (Bug-free View Switching) ── */
#app { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.view {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  opacity: 0; pointer-events: none; transform: translateY(16px) scale(0.98);
  transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-out);
}
.view.active {
  opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); z-index: 10;
}

/* ─────── CLOCK VIEW ─────── */
#v-clock { padding-top: max(env(safe-area-inset-top), 64px); }
#hdr { padding: 0 40px; flex-shrink: 0; cursor: pointer; user-select: none; }
#brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
#led {
  width: 8px; height: 8px; background: var(--c-primary);
  border-radius: 50%; flex-shrink: 0;
  animation: blink 2.4s cubic-bezier(.4,0,.6,1) infinite;
}
@keyframes blink { 0%,45%,55%,100% { opacity: 1; } 50% { opacity: .2; } }
#brand-name {
  font-size: 14px; font-weight: 700; letter-spacing: 4px;
  color: var(--c-primary); text-transform: uppercase;
}
.time-row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px; }
#clock {
  font-size: clamp(80px, 22vw, 130px); font-weight: 500;
  letter-spacing: -3px; font-variant-numeric: tabular-nums; line-height: 1;
}
#sec {
  font-size: clamp(28px, 6vw, 36px); font-weight: 700;
  color: var(--c-primary); font-variant-numeric: tabular-nums; letter-spacing: 0;
}
#ampm { font-size: 18px; font-weight: 700; color: var(--c-on-surface-var); letter-spacing: 1.5px; }
#meta {
  font-size: 15px; font-weight: 600; letter-spacing: 2px;
  color: var(--c-on-surface-var); text-transform: uppercase;
  height: 22px; overflow: hidden; margin-top: 8px;
  transition: opacity .3s, transform .3s var(--ease-out);
}

/* DATE STRIP (Native Scrolling) */
#strip {
  display: flex; overflow-x: auto; padding: 48px 40px 24px; gap: 20px;
  scroll-snap-type: x mandatory; scrollbar-width: none; flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}
#strip::-webkit-scrollbar { display: none; }
.frame {
  min-width: 108px; height: 152px;
  background: var(--c-surface-ctr); border-radius: var(--r-l);
  padding: 24px 20px; scroll-snap-align: center;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative; overflow: hidden; flex-shrink: 0; cursor: pointer;
  user-select: none; -webkit-user-select: none;
  transition: background .3s var(--ease-std), transform .3s var(--ease-out), box-shadow .3s var(--ease-std);
}
.frame::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: var(--c-on-surface); opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.frame:active { transform: scale(0.94); }
.frame:active::before { opacity: .08; }
.frame.active {
  background: var(--c-primary); color: var(--c-on-primary);
  transform: scale(1.08) translateY(-6px);
  box-shadow: 0 16px 32px rgba(186, 26, 26, .25);
}
.frame.active:active { transform: scale(1.03) translateY(-6px); }
.frame.active::before { background: var(--c-on-primary); }
.f-m { font-size: 13px; font-weight: 700; opacity: .6; letter-spacing: .5px; }
.f-d { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -1px; margin-top: 6px; }
.f-w { font-size: 12px; font-weight: 700; opacity: .7; text-transform: uppercase; letter-spacing: .5px; }
.f-e { font-size: 11px; font-weight: 700; color: var(--c-primary); margin-top: 10px; min-height: 16px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.frame.active .f-e { color: var(--c-primary-ctr); }

/* INFO CARD */
#card {
  flex: 1; min-height: 0; margin: 16px 40px 160px; 
  padding: 40px; background: var(--c-surface-ctr); border-radius: var(--r-xl);
  display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden;
  transition: opacity .3s;
}
#card::after {
  content: ''; position: absolute; bottom: -50px; right: -50px;
  width: 160px; height: 160px; border-radius: 50%;
  background: var(--c-primary); opacity: .04; pointer-events: none;
}
#v-title { font-size: 32px; font-weight: 700; line-height: 1.2; letter-spacing: -.5px; }
#v-body { font-size: 18px; color: var(--c-on-surface-var); line-height: 1.8; }

/* ─────── TIMER VIEW ─────── */
#v-timer {
  align-items: center; justify-content: center;
  padding: max(env(safe-area-inset-top), 64px) 40px 160px;
  gap: 0; overflow: hidden;
}
.ring-wrap {
  position: relative; flex-shrink: 0;
  width: min(60vw, 60vh, 360px); height: min(60vw, 60vh, 360px);
  display: flex; align-items: center; justify-content: center;
  transition: transform .6s var(--ease-std);
}
.ring-svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  transform: rotate(-90deg); overflow: visible;
}
.ring-track { fill: none; stroke: var(--c-surface-ctr-hi); stroke-width: 10; }
.ring-prog {
  fill: none; stroke: var(--c-primary); stroke-width: 10; stroke-linecap: round;
  stroke-dasharray: 276.46; stroke-dashoffset: 0;
  transition: stroke-dashoffset .1s linear;
  filter: drop-shadow(0 0 12px rgba(186, 26, 26, .25));
}
.ring-glow {
  fill: none; stroke: var(--c-primary); stroke-width: 28; stroke-linecap: round;
  stroke-dasharray: 276.46; stroke-dashoffset: 0; opacity: 0;
}
.ring-wrap.running .ring-glow { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0; } 50% { opacity: .12; } }
.t-disp { z-index: 1; display: flex; flex-direction: column; align-items: center; }
#t-min-sec {
  font-size: clamp(72px, 16vw, 100px); font-weight: 500;
  font-variant-numeric: tabular-nums; letter-spacing: -2px; line-height: 1;
  transform-origin: center;
}
#t-min-sec.urgent { color: var(--c-primary); font-weight: 700; }
#t-cs {
  font-size: 28px; font-weight: 500; color: var(--c-primary);
  font-variant-numeric: tabular-nums; font-family: 'DM Mono', monospace;
  letter-spacing: 0; margin-top: 12px; opacity: .9;
}

/* ELEGANT TIMER PRESETS (GRID) */
.t-presets {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  margin-top: 64px; width: 100%; max-width: 400px;
  transition: opacity .5s var(--ease-std), transform .5s var(--ease-std);
}
.t-btn {
  background: var(--c-surface-ctr); border-radius: var(--r-l); height: 88px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; user-select: none; position: relative; overflow: hidden;
  transition: transform .2s var(--ease-out), background .2s;
}
.t-btn::before { content: ''; position: absolute; inset: 0; background: var(--c-on-surface); opacity: 0; transition: opacity .2s; }
.t-btn:active { transform: scale(0.9); }
.t-btn:active::before { opacity: 0.08; }
.t-val { font-size: 28px; font-weight: 500; color: var(--c-primary); line-height: 1; font-variant-numeric: tabular-nums; }
.t-lbl { font-size: 12px; font-weight: 700; color: var(--c-on-surface-var); letter-spacing: 1px; margin-top: 8px; }
.t-btn.clear { background: transparent; border: 2px solid var(--c-surface-ctr-hi); }
.t-btn.clear .t-val { color: var(--c-error); font-size: 16px; font-weight: 700; letter-spacing: 1px; margin-top: 0; }

/* FOCUS MODE */
#v-timer.is-running .t-presets { opacity: 0; pointer-events: none; transform: translateY(40px) scale(0.95); }
#v-timer.is-running .ring-wrap { transform: scale(1.15); }

/* ─────── STOPWATCH VIEW ─────── */
#v-sw { padding-top: max(env(safe-area-inset-top), 64px); }
.sw-top { text-align: center; padding: 32px 40px 48px; flex-shrink: 0; }
#sw-hms {
  font-size: clamp(72px, 18vw, 110px); font-weight: 500;
  letter-spacing: -3px; font-variant-numeric: tabular-nums; line-height: 1;
}
#sw-cs {
  display: block; font-size: clamp(28px, 6vw, 36px); font-weight: 500;
  color: var(--c-primary); font-variant-numeric: tabular-nums;
  font-family: 'DM Mono', monospace; letter-spacing: 0; margin-top: 16px;
}
.laps-scroll {
  flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; 
  padding: 0 40px 160px; scroll-behavior: smooth;
}
.laps-scroll::-webkit-scrollbar { display: none; }
.laps-empty {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 80px 24px; gap: 20px; opacity: .4;
}
.laps-empty svg { width: 48px; height: 48px; fill: var(--c-on-surface-var); }
.laps-empty span { font-size: 16px; font-weight: 600; color: var(--c-on-surface-var); }
.lap-row {
  display: flex; align-items: center; padding: 28px 32px; gap: 20px;
  background: var(--c-surface-ctr); border-radius: var(--r-l); margin-bottom: 20px;
  position: relative; overflow: hidden;
  animation: lapIn .4s var(--ease-out) both;
}
.lap-row::before { content: ''; position: absolute; inset: 0; background: var(--c-on-surface); opacity: 0; transition: opacity .2s; }
.lap-row:active { transform: scale(0.98); transition: transform .2s; }
.lap-row:active::before { opacity: .06; }
.lap-row.best .lap-split { color: var(--c-primary); font-weight: 700; }
.lap-row.worst { opacity: .6; }
@keyframes lapIn { from { opacity: 0; transform: translateY(-20px) scale(0.98); } to { opacity: 1; transform: none; } }
.lap-num { font-size: 16px; font-weight: 700; color: var(--c-on-surface-var); min-width: 64px; }
.lap-split { font-size: 22px; font-weight: 500; font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; flex: 1; color: var(--c-on-surface); }
.lap-total { font-size: 16px; font-weight: 400; font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; color: var(--c-on-surface-var); opacity: .7; }

/* ─────── WORLD CLOCK VIEW ─────── */
#v-world { padding-top: max(env(safe-area-inset-top), 64px); }
.w-hdr {
  display: flex; align-items: center; gap: 16px; padding: 0 40px 40px;
  font-size: 14px; font-weight: 700; letter-spacing: 4px;
  color: var(--c-primary); text-transform: uppercase; flex-shrink: 0;
}
.w-scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 40px 160px; }
.w-scroll::-webkit-scrollbar { display: none; }
.tz-row {
  display: flex; align-items: center; padding: 28px 32px; gap: 24px;
  background: var(--c-surface-ctr); border-radius: var(--r-l); margin-bottom: 20px;
  position: relative; overflow: hidden;
}
.tz-row::before { content: ''; position: absolute; inset: 0; background: var(--c-on-surface); opacity: 0; transition: opacity .2s; }
.tz-row:active { transform: scale(0.98); transition: transform .2s; }
.tz-row:active::before { opacity: .06; }
.tz-flag { font-size: 36px; flex-shrink: 0; width: 48px; text-align: center; }
.tz-info { flex: 1; min-width: 0; }
.tz-city { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
.tz-zone { font-size: 14px; color: var(--c-on-surface-var); font-weight: 500; margin-top: 8px; }
.tz-right { text-align: right; flex-shrink: 0; }
.tz-time { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; font-family: 'DM Sans', sans-serif; }
.tz-day { font-size: 13px; font-weight: 700; color: var(--c-on-surface-var); text-transform: uppercase; letter-spacing: .5px; margin-top: 8px; }

/* ─────── FLOATING DYNAMIC ISLAND NAV ─────── */
#nav {
  position: fixed;
  bottom: max(env(safe-area-inset-bottom), 32px);
  left: 50%; transform: translateX(-50%);
  background: var(--c-surface-ctr-hi);
  border-radius: 100px;
  display: flex; padding: 10px; gap: 8px;
  box-shadow: 0 20px 48px rgba(186, 26, 26, 0.08), 0 8px 20px rgba(0,0,0,0.06);
  z-index: 600; width: max-content; max-width: calc(100vw - 48px);
}
.ni {
  position: relative; display: flex; align-items: center;
  border-radius: 100px; padding: 16px 24px; height: 60px;
  cursor: pointer; user-select: none; color: var(--c-on-surface-var);
  transition: all .4s var(--ease-out);
}
.ni svg { width: 26px; height: 26px; fill: currentColor; flex-shrink: 0; transition: transform .2s var(--ease-out); }
.ni:active svg { transform: scale(.85); }
.ni-label {
  font-size: 16px; font-weight: 700; letter-spacing: .3px;
  max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap;
  transition: max-width .4s var(--ease-out), opacity .3s var(--ease-out), margin .4s var(--ease-out);
}
.ni.active { background: var(--c-secondary-ctr); color: var(--c-on-secondary-ctr); }
.ni.active .ni-label { max-width: 140px; opacity: 1; margin-left: 12px; }
.badge {
  position: absolute; top: 14px; right: 16px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--c-primary); border: 2px solid var(--c-surface-ctr-hi);
  z-index: 2; transform: scale(0); transition: transform .3s var(--ease-out);
}
.ni.active .badge { border-color: var(--c-secondary-ctr); right: auto; left: 42px; }
.badge.on { transform: scale(1); }

/* ─────── FAB ─────── */
.fab-wrap {
  position: fixed;
  bottom: max(calc(env(safe-area-inset-bottom) + 124px), 132px);
  right: 40px; display: flex; flex-direction: column; align-items: flex-end; gap: 20px;
  z-index: 500;
}
.fab {
  height: 72px; border-radius: var(--r-l);
  display: flex; align-items: center; justify-content: center; gap: 16px;
  padding: 0 32px; font-family: 'DM Sans', sans-serif; font-size: 18px;
  font-weight: 700; letter-spacing: .5px; cursor: pointer; user-select: none;
  position: relative; overflow: hidden; white-space: nowrap;
  transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-std);
}
.fab::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity .2s; }
.fab:active { transform: scale(.92); }
.fab:active::before { opacity: .12; }
.fab svg { width: 28px; height: 28px; fill: currentColor; flex-shrink: 0; }
#fab-main { background: var(--c-primary-ctr); color: var(--c-on-primary-ctr); box-shadow: 0 12px 28px rgba(0,0,0,.12); }
#fab-sec {
  height: 60px; width: 60px; padding: 0; border-radius: var(--r-m);
  background: var(--c-surface-ctr-hi); color: var(--c-on-surface-var);
  box-shadow: 0 6px 16px rgba(0,0,0,.08); display: none;
}
#fab-sec.on { display: flex; }
#fab-label { display: inline-block; max-width: 100px; overflow: hidden; transition: max-width .3s var(--ease-out), opacity .2s; }
#fab-label.gone { max-width: 0; opacity: 0; }

/* ─────── EFFECTS & SNACKBAR ─────── */
#cv { position: fixed; inset: 0; pointer-events: none; z-index: 800; }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9000; }
#snack {
  position: fixed; top: max(env(safe-area-inset-top), 40px);
  left: 50%; transform: translateX(-50%) translateY(-20px);
  background: var(--c-inverse-surface); color: var(--c-inverse-on);
  padding: 0 28px; height: 64px; border-radius: var(--r-full);
  font-size: 18px; font-weight: 600; display: flex; align-items: center; white-space: nowrap;
  opacity: 0; pointer-events: none; z-index: 2000; box-shadow: 0 16px 40px rgba(0,0,0,.15);
  transition: opacity .3s var(--ease-std), transform .3s var(--ease-std);
}
#snack.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─────── LANDSCAPE ─────── */
@media (orientation: landscape) {
  #v-clock { flex-direction: row; flex-wrap: nowrap; overflow: hidden; }
  #hdr { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; padding: max(env(safe-area-inset-top), 32px) 48px 0 max(env(safe-area-inset-left), 48px); width: 50%; }
  #brand { margin-bottom: 24px; }
  #clock { font-size: clamp(72px, 12vw, 120px); }
  #sec { font-size: clamp(20px, 3vw, 28px); }
  #strip { flex-direction: column; overflow-x: hidden; overflow-y: auto; padding: max(env(safe-area-inset-top), 32px) 0 32px 0; flex: 0 0 140px; gap: 20px; scroll-snap-type: y mandatory; }
  .frame { min-width: unset; width: 110px; height: 88px; padding: 16px; flex-direction: row; align-items: center; gap: 12px; scroll-snap-align: center; }
  .f-m, .f-e { display: none; }
  .f-d { font-size: 32px; margin-top: 0; }
  #card { flex: 1; min-height: 0; margin: 40px 40px 140px max(calc(env(safe-area-inset-right) + 32px), 40px); }
  #v-timer { flex-direction: row; gap: 64px; padding: max(env(safe-area-inset-top), 40px) 48px 140px; }
  .ring-wrap { width: min(50vh, 320px); height: min(50vh, 320px); }
  .t-presets { margin-top: 0; max-width: 360px; }
  #v-sw { flex-direction: row; }
  .sw-top { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; width: 45%; padding: max(env(safe-area-inset-top), 40px) 40px 40px 48px; }
  .laps-scroll { padding: max(env(safe-area-inset-top), 40px) 48px 140px 0; }
  #v-world { flex-direction: row; }
  .w-hdr { flex: 0 0 auto; flex-direction: column; justify-content: flex-start; width: 80px; padding: max(env(safe-area-inset-top), 80px) 24px 40px; writing-mode: vertical-lr; text-orientation: mixed; gap: 16px; letter-spacing: 4px; }
  .w-scroll { padding: max(env(safe-area-inset-top), 40px) 48px 140px 0; }
}
</style>
</head>
<body>

<div id="flash"></div>
<canvas id="cv"></canvas>
<div id="snack"></div>

<div id="app">
  <!-- CLOCK -->
  <div id="v-clock" class="view active">
    <div id="hdr" onclick="snapToday()">
      <div id="brand"><div id="led"></div><span id="brand-name">YOMI TIME</span></div>
      <div class="time-row">
        <div id="clock">00:00</div>
        <div id="sec">:00</div>
        <div id="ampm">AM</div>
      </div>
      <div id="meta">CALIBRATING…</div>
    </div>
    <div id="strip"></div>
    <div id="card">
      <div id="v-title">—</div>
      <div id="v-body">—</div>
    </div>
  </div>

  <!-- TIMER -->
  <div id="v-timer" class="view">
    <div class="ring-wrap" id="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 100 100">
        <circle class="ring-track" cx="50" cy="50" r="44"/>
        <circle class="ring-glow" cx="50" cy="50" r="44" id="ring-glow"/>
        <circle class="ring-prog" cx="50" cy="50" r="44" id="ring-prog"/>
      </svg>
      <div class="t-disp">
        <div id="t-min-sec">00:00</div>
        <div id="t-cs">.00</div>
      </div>
    </div>
    
    <!-- ELEGANT TOUCH GRID -->
    <div class="t-presets">
      <div class="t-btn" onclick="addTimer(60)">
        <span class="t-val">+1</span><span class="t-lbl">MIN</span>
      </div>
      <div class="t-btn" onclick="addTimer(180)">
        <span class="t-val">+3</span><span class="t-lbl">MIN</span>
      </div>
      <div class="t-btn" onclick="addTimer(300)">
        <span class="t-val">+5</span><span class="t-lbl">MIN</span>
      </div>
      <div class="t-btn" onclick="addTimer(600)">
        <span class="t-val">+10</span><span class="t-lbl">MIN</span>
      </div>
      <div class="t-btn" onclick="addTimer(1800)">
        <span class="t-val">+30</span><span class="t-lbl">MIN</span>
      </div>

<script>
/* ═══════════════════════ DATA ═══════════════════════ */
const DB = {
  "01-01":{n:"元旦", d:"时间的矢量在此处重置。",egg:"burst"},
  "01-15":{n:"元宵节", d:"正月十五，火树银花，千灯如昼。"},

  "03-21":{n:"春分", d:"昼夜等长，春和景明。"},

  "12-13":{n:"", d:"国家公祭日。铭记历史，守望和平。",isMourning:true},

  "12-31":{n:"跨年夜", d:"另一段时间的序章即将开始。",egg:"burst"},
};
const MO=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const WK=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const TZ=[
  {c:"New York", z:"America/New_York", f:"🇺🇸"},
  {c:"London", z:"Europe/London", f:"🇬🇧"},
  {c:"Paris", z:"Europe/Paris", f:"🇫🇷"},
  {c:"Moscow", z:"Europe/Moscow", f:"🇷🇺"},
  {c:"Dubai", z:"Asia/Dubai", f:"🇦🇪"},
  {c:"Mumbai", z:"Asia/Kolkata", f:"🇮🇳"},
  {c:"Singapore", z:"Asia/Singapore", f:"🇸🇬"},
  {c:"Tokyo", z:"Asia/Tokyo", f:"🇯🇵"},
  {c:"Sydney", z:"Australia/Sydney", f:"🇦🇺"},
  {c:"São Paulo", z:"America/Sao_Paulo", f:"🇧🇷"},
  {c:"Los Angeles", z:"America/Los_Angeles", f:"🇺🇸"},
];

const ICONS={
  today:'<path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>',
  play: '<path d="M8 5v14l11-7z"/>',
  pause:'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
  stop: '<path d="M6 6h12v12H6z"/>',
  lap:  '<path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/>',
  world:'<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>',
};

/* ═══════════════════════ UTILS ═══════════════════════ */
const $ = id => document.getElementById(id);
function pad(n) { const s = String(Math.floor(Math.max(0, n))); return s.length < 2 ? '0' + s : s; }
function key(d) { return pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function tryVibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

/* ═══════════════════════ STATE ═══════════════════════ */
let tab = 'clock';
// timer
let tTotal = 0, tLeft = 0, tRunning = false, tEnd = 0, tRaf = null;
// stopwatch
let swStart = 0, swElapsed = 0, swRunning = false, swRaf = null, swLapCount = 0, swLaps = [];
let lastSwHms = "", lastSwCs = ""; 
// fx
let ptcls = [], fxRaf = null;
// world
let wTimer = null;

/* ═══════════════════════ INIT ═══════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  buildStrip(); syncClock(); updateFAB(); buildWorld();
});

/* ═══════════════════════ NAVIGATION ═══════════════════════ */
function go(t, el) {
  if (tab === t) return;
  
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $(`v-${t}`).classList.add('active');
  
  tab = t;
  
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  
  tryVibrate(4);
  updateFAB();
  if (t === 'world') tickWorld();
}

/* ═══════════════════════ FAB ═══════════════════════ */
function updateFAB() {
  const icon = $('fab-icon'), lbl = $('fab-label');
  const sec = $('fab-sec'), secIcon = $('fab-sec-icon');
  sec.classList.remove('on');
  
  if (tab === 'clock') {
    icon.innerHTML = ICONS.today; lbl.textContent = 'TODAY'; lbl.classList.remove('gone');
  } else if (tab === 'timer') {
    icon.innerHTML = tRunning ? ICONS.pause : ICONS.play;
    lbl.textContent = tRunning ? 'PAUSE' : 'START'; lbl.classList.remove('gone');
    if (tTotal > 0) { sec.classList.add('on'); secIcon.innerHTML = ICONS.stop; }
    $('b-timer').classList.toggle('on', tRunning);
  } else if (tab === 'sw') {
    icon.innerHTML = swRunning ? ICONS.pause : ICONS.play;
    lbl.textContent = swRunning ? 'PAUSE' : 'START'; lbl.classList.remove('gone');
    if (swElapsed > 0 || swRunning) { sec.classList.add('on'); secIcon.innerHTML = swRunning ? ICONS.lap : ICONS.stop; }
    $('b-sw').classList.toggle('on', swRunning);
  } else if (tab === 'world') {
    icon.innerHTML = ICONS.world; lbl.textContent = 'REFRESH'; lbl.classList.remove('gone');
  }
}

function fabMain() {
  if (tab === 'clock') snapToday();
  else if (tab === 'timer') toggleTimer();
  else if (tab === 'sw') toggleSW();
  else if (tab === 'world') { tickWorld(); snack('Refreshed'); }
}
function fabSec() {
  if (tab === 'timer') resetTimer();
  else if (tab === 'sw') { if (swRunning) recordLap(); else resetSW(); }
}

/* ═══════════════════════ CLOCK ═══════════════════════ */
function buildStrip() {
  const strip = $('strip'), today = new Date(); today.setHours(0,0,0,0);
  const frag = document.createDocumentFragment();
  for (let i = -30; i <= 365; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    const k = key(d), inf = DB[k] || null, el = document.createElement('div');
    el.className = 'frame' + (i === 0 ? ' today-frame' : '');
    if (inf && inf.isMourning) {
      el.innerHTML = `<div><div class="f-m">${d.getMonth()+1}月</div><div class="f-d">${d.getDate()}</div></div><div><div class="f-w">${WK[d.getDay()]}</div><div class="f-e"></div></div>`;
    } else {
      el.innerHTML = `<div><div class="f-m">${d.getMonth()+1}月</div><div class="f-d">${d.getDate()}</div></div><div><div class="f-w">${WK[d.getDay()]}</div><div class="f-e">${inf?inf.n:''}</div></div>`;
    }
    el.addEventListener('click', e => pickDay(el, d, inf, e));
    frag.appendChild(el);
  }
  strip.appendChild(frag); snapToday();
}

function pickDay(el, d, inf, e) {
  document.querySelectorAll('.frame.active').forEach(f => f.classList.remove('active'));
  el.classList.add('active');
  
  // NATIVE BUG-FREE CENTERING
  el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  
  const meta = $('meta');
  meta.style.opacity = '0'; meta.style.transform = 'translateY(5px)';
  setTimeout(() => {
    meta.textContent = `${d.getFullYear()} · ${MO[d.getMonth()]} · ${pad(d.getDate())}`;
    meta.style.transition = 'opacity .2s, transform .3s var(--ease-out)';
    meta.style.opacity = '1'; meta.style.transform = 'none';
  }, 70);
  
  const card = $('card'); card.style.opacity = '0';
  setTimeout(() => {
    $('v-title').textContent = (inf && inf.n) ? inf.n : 'REALTIME';
    $('v-body').textContent = (inf && inf.d) ? inf.d : '一切如常。未发现显著的时间异常。';
    card.style.transition = 'opacity .15s'; card.style.opacity = '1';
  }, 140);
  
  document.body.classList.toggle('mourning', !!(inf && inf.isMourning));
  if (inf && inf.egg && e) fxBurst(e);
  if (inf && inf.egg === 'flash') fxFlash();
  tryVibrate(6);
}

function snapToday() {
  const el = document.querySelector('.today-frame'); if (!el) return;
  const d = new Date(); d.setHours(0,0,0,0);
  pickDay(el, d, DB[key(d)] || null, null);
}

function syncClock() {
  const n = new Date();
  $('clock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
  $('sec').textContent = ':' + pad(n.getSeconds());
  $('ampm').textContent = n.getHours() < 12 ? 'AM' : 'PM';
  
  const msToNextSec = 1000 - n.getMilliseconds();
  setTimeout(syncClock, msToNextSec);
}

/* ═══════════════════════ TIMER ═══════════════════════ */
const RING = 276.46;

function popTimeAnim() {
  const el = $('t-min-sec');
  el.style.transition = 'none';
  el.style.transform = 'scale(1.08)';
  el.style.color = 'var(--c-primary)';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.transition = 'transform 0.4s var(--ease-out), color 0.4s var(--ease-out)';
    el.style.transform = 'none';
    el.style.color = '';
  }));
}

function addTimer(sec) {
  if (tRunning) return;
  tTotal = Math.max(0, tTotal + sec); tLeft = tTotal;
  updateTimerUI(); updateFAB();
  popTimeAnim();
  tryVibrate(5);
}

function resetTimer() {
  tRunning = false; tTotal = 0; tLeft = 0;
  if (tRaf) { cancelAnimationFrame(tRaf); tRaf = null; }
  $('v-timer').classList.remove('is-running');
  $('ring-wrap').classList.remove('running');
  $('t-min-sec').classList.remove('urgent');
  updateTimerUI(); updateFAB();
}

function toggleTimer() {
  if (tTotal === 0) return;
  if (tRunning) {
    tRunning = false; tLeft = Math.max(0, (tEnd - Date.now()) / 1000);
    if (tRaf) { cancelAnimationFrame(tRaf); tRaf = null; }
    $('v-timer').classList.remove('is-running');
    $('ring-wrap').classList.remove('running');
  } else {
    tRunning = true; tEnd = Date.now() + tLeft * 1000;
    $('v-timer').classList.add('is-running');
    $('ring-wrap').classList.add('running');
    tRaf = requestAnimationFrame(tickTimer);
  }
  updateFAB();
}

function tickTimer() {
  if (!tRunning) return;
  tLeft = Math.max(0, (tEnd - Date.now()) / 1000);
  updateTimerUI();
  if (tLeft <= 0) {
    tRunning = false; tTotal = 0; tLeft = 0;
    if (tRaf) { cancelAnimationFrame(tRaf); tRaf = null; }
    $('v-timer').classList.remove('is-running');
    $('ring-wrap').classList.remove('running');
    $('t-min-sec').classList.remove('urgent');
    updateTimerUI(); updateFAB();
    fxFlash(); snack('Timer complete ✓');
    tryVibrate([200, 100, 200, 100, 200]);
  } else {
    $('t-min-sec').classList.toggle('urgent', tLeft < 10);
    tRaf = requestAnimationFrame(tickTimer);
  }
}

function updateTimerUI() {
  const m = Math.floor(tLeft / 60), s = Math.floor(tLeft % 60);
  const cs = Math.floor((tLeft % 1) * 100);
  $('t-min-sec').textContent = pad(m) + ':' + pad(s);
  $('t-cs').textContent = '.' + pad(cs);
  
  const ratio = tTotal > 0 ? (tLeft / tTotal) : 1;
  const off = Math.max(0, Math.min(RING, RING * (1 - ratio)));
  $('ring-prog').style.strokeDashoffset = off;
  $('ring-glow').style.strokeDashoffset = off;
}

/* ═══════════════════════ STOPWATCH ═══════════════════════ */
function toggleSW() {
  if (swRunning) {
    swRunning = false; swElapsed += Date.now() - swStart;
    if (swRaf) { cancelAnimationFrame(swRaf); swRaf = null; }
  } else {
    swRunning = true; swStart = Date.now();
    swRaf = requestAnimationFrame(tickSW);
  }
  updateFAB();
}
function resetSW() {
  swRunning = false; swElapsed = 0; swLapCount = 0; swLaps = [];
  if (swRaf) { cancelAnimationFrame(swRaf); swRaf = null; }
  lastSwHms = ""; lastSwCs = ""; 
  updateSWUI(0); updateFAB();
  
  const box = $('laps-box');
  box.style.transition = 'opacity .2s'; box.style.opacity = '0';
  setTimeout(() => {
    box.innerHTML = '<div class="laps-empty" id="laps-empty"><svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg><span>Laps will appear here</span></div>';
    box.style.opacity = '1';
  }, 200);
  $('b-sw').classList.remove('on');
}
function fmtSW(ms) {
  ms = Math.max(0, ms);
  return pad(Math.floor(ms / 60000)) + ':' + pad(Math.floor((ms % 60000) / 1000)) + '.' + pad(Math.floor((ms % 1000) / 10));
}
function updateSWUI(ms) {
  ms = Math.max(0, ms);
  const hms = pad(Math.floor(ms / 60000)) + ':' + pad(Math.floor((ms % 60000) / 1000));
  const cs = '.' + pad(Math.floor((ms % 1000) / 10));
  
  if (hms !== lastSwHms) { $('sw-hms').textContent = hms; lastSwHms = hms; }
  if (cs !== lastSwCs) { $('sw-cs').textContent = cs; lastSwCs = cs; }
}
function tickSW() {
  if (!swRunning) return;
  updateSWUI(swElapsed + (Date.now() - swStart));
  swRaf = requestAnimationFrame(tickSW);
}
function recordLap() {
  if (!swRunning) return;
  swLapCount++;
  const total = swElapsed + (Date.now() - swStart);
  const prev = swLaps.length > 0 ? swLaps[swLaps.length - 1].total : 0;
  const split = total - prev;
  swLaps.push({ split, total });
  
  const empty = document.getElementById('laps-empty');
  if (empty) empty.remove();
  
  const row = document.createElement('div');
  row.className = 'lap-row';
  row.innerHTML = `<span class="lap-num">Lap ${pad(swLapCount)}</span><span class="lap-split">${fmtSW(split)}</span><span class="lap-total">${fmtSW(total)}</span>`;
  
  const box = $('laps-box');
  box.firstChild ? box.insertBefore(row, box.firstChild) : box.appendChild(row);
  $('laps-scroll').scrollTop = 0; 
  
  refreshLapColors();
  tryVibrate(10);
}
function refreshLapColors() {
  if (swLaps.length < 2) return;
  const sp = swLaps.map(l => l.split);
  const best = Math.min(...sp), worst = Math.max(...sp);
  $('laps-box').querySelectorAll('.lap-row').forEach((row, i) => {
    const idx = swLaps.length - 1 - i;
    row.classList.remove('best', 'worst');
    if (swLaps[idx].split === best) row.classList.add('best');
    else if (swLaps[idx].split === worst) row.classList.add('worst');
  });
}

/* ═══════════════════════ WORLD CLOCK ═══════════════════════ */
function buildWorld() {
  const list = $('w-list'); list.innerHTML = '';
  TZ.forEach(tz => {
    const row = document.createElement('div'); row.className = 'tz-row'; row.dataset.z = tz.z;
    row.innerHTML = `<div class="tz-flag">${tz.f}</div><div class="tz-info"><div class="tz-city">${tz.c}</div><div class="tz-zone">${tz.z.replace(/_/g, ' ')}</div></div><div class="tz-right"><div class="tz-time" data-t></div><div class="tz-day" data-d></div></div>`;
    list.appendChild(row);
  });
  tickWorld();
}
function tickWorld() {
  const now = Date.now();
  const localDate = new Date(now);
  
  $('w-list').querySelectorAll('.tz-row').forEach(row => {
    const z = row.dataset.z;
    try {
      const fmtTime = new Intl.DateTimeFormat('en-GB', { timeZone: z, hour: '2-digit', minute: '2-digit', hour12: false });
      let ts = fmtTime.format(now);
      if (ts.startsWith('24')) ts = '00' + ts.slice(2);
      row.querySelector('[data-t]').textContent = ts;
      
      // BUG-FREE DATE CALCULATION
      const fmtDate = new Intl.DateTimeFormat('en-US', { timeZone: z, weekday: 'short', month: 'short', day: 'numeric' });
      row.querySelector('[data-d]').textContent = fmtDate.format(now).toUpperCase();
    } catch(e) {
      row.querySelector('[data-t]').textContent = '--:--';
    }
  });
  
  if (wTimer) clearTimeout(wTimer);
  const msToNext = (60 - new Date().getSeconds()) * 1000 - new Date().getMilliseconds();
  wTimer = setTimeout(tickWorld, msToNext + 50);
}

/* ═══════════════════════ EFFECTS ═══════════════════════ */
function fxFlash() {
  const f = $('flash');
  f.style.transition = 'none'; f.style.opacity = '.8';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    f.style.transition = 'opacity .6s cubic-bezier(0.2,0,0,1)'; f.style.opacity = '0';
  }));
}
function fxBurst(e) {
  const cv = $('cv'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cx = e ? e.clientX : innerWidth / 2, cy = e ? e.clientY : innerHeight / 2;
  const cols = ['#BA1A1A', '#FFDAD6', '#410002', '#FFB4AB', '#201A19'];
  const pts = Array.from({ length: 72 }, (_, i) => {
    const a = Math.PI * 2 * i / 72 + Math.random() * .2 - .1;
    const sp = Math.random() * 10 + 5;
    return {
      x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - Math.random() * 3,
      life: 1, dec: .012 + Math.random() * .01, sz: Math.random() * 4 + 1.5,
      col: cols[Math.floor(Math.random() * cols.length)], circle: Math.random() > .3
    };
  });
  ptcls.push(...pts);
  if (!fxRaf) (function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    let alive = false;
    for (let i = ptcls.length - 1; i >= 0; i--) {
      const p = ptcls[i]; if (p.life <= 0) { ptcls.splice(i, 1); continue; }
      alive = true; p.vx *= .95; p.vy += .22; p.x += p.vx; p.y += p.vy; p.life -= p.dec;
      ctx.globalAlpha = Math.max(0, p.life * p.life); ctx.fillStyle = p.col;
      if (p.circle) { ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
    if (alive) fxRaf = requestAnimationFrame(loop);
    else { fxRaf = null; ctx.clearRect(0, 0, cv.width, cv.height); }
  })();
}

/* ═══════════════════════ SNACK ═══════════════════════ */
let snackT = null;
function snack(msg) {
  const s = $('snack'); s.textContent = msg; s.classList.add('on');
  if (snackT) clearTimeout(snackT);
  snackT = setTimeout(() => s.classList.remove('on'), 2400);
}
