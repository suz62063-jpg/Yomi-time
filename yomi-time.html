<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>YOMI TIME</title>
<style>
:root {
  --red:   #e30613;
  --black: #121212;
  --gray:  #86868b;
  --line:  #f0f0f0;
}

body.mourning { filter: grayscale(100%); }

*, *::before, *::after {
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
  margin: 0; padding: 0;
}

body {
  background: #fff;
  color: var(--black);
  font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  overscroll-behavior: none;
}

/* ── 启动遮罩 ── */
#mask {
  position: fixed; inset: 0; background: #fff; z-index: 900;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.5s ease, visibility 0.5s;
}
#mask.gone { opacity: 0; visibility: hidden; }

#dot {
  width: 13px; height: 13px; background: var(--red); border-radius: 50%;
  transform: scale(0);
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
#dot.pop   { transform: scale(1); }
#dot.burst { transform: scale(150); opacity: 0; transition: transform 0.38s ease-in, opacity 0.3s 0.1s ease-in; }

/* ── 头部 ── */
#header {
  padding: max(env(safe-area-inset-top), 52px) 28px 18px;
  cursor: pointer;
  user-select: none;
  flex-shrink: 0;
}

#brand {
  font-size: 10px; font-weight: 900; letter-spacing: 3.5px;
  color: var(--red); font-family: monospace; margin-bottom: 10px;
  display: flex; align-items: center; gap: 7px;
}
#led {
  width: 6px; height: 6px; background: var(--red); border-radius: 50%;
  animation: blink 2.4s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

#clock {
  font-size: clamp(80px, 23vw, 112px);
  font-weight: 700;
  letter-spacing: -7px;
  line-height: .82;
  margin-bottom: 6px;
}

#sub {
  display: flex; align-items: baseline; gap: 8px;
}
#sec  { font-size: 18px; font-weight: 700; font-family: monospace; color: var(--red); min-width: 36px; }
#ampm { font-size: 11px; font-weight: 700; color: var(--gray); font-family: monospace; }

#meta {
  margin-top: 10px;
  font-size: 11px; font-weight: 600; color: var(--gray); font-family: monospace; letter-spacing: .4px;
}

/* ── 胶片条 ── */
#strip {
  display: flex;
  overflow-x: auto;
  padding: 24px 20px;
  gap: 11px;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}
#strip::-webkit-scrollbar { display: none; }

.frame {
  min-width: 80px; height: 120px;
  background: var(--line); border-radius: 2px;
  padding: 11px 10px;
  scroll-snap-align: center;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer;
  transition: background .28s, color .28s, transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s;
  user-select: none;
}
.frame.active {
  background: var(--black); color: #fff;
  transform: scale(1.06);
  box-shadow: 0 10px 28px rgba(0,0,0,.13);
}

.f-m { font-size: 9px; font-weight: 900; opacity: .38; }
.f-d { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
.f-w { font-size: 9px; font-weight: 700; opacity: .55; text-transform: uppercase; }
.f-e { font-size: 8px; color: var(--red); font-weight: 900; margin-top: 2px; min-height: 9px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.frame.active .f-e { color: #ff6060; }

/* ── 详情区 ── */
#view {
  flex: 1; min-height: 0;
  padding: 26px 28px;
  border-top: 1px solid var(--line);
}
#v-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
#v-body  { font-size: 14px; color: var(--gray); line-height: 1.85; max-width: 88%; }

/* ── 效果层 ── */
#cv    { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; z-index: 800; pointer-events: none; }

/* ── 重置按钮 ── */
#reset {
  position: fixed;
  bottom: max(env(safe-area-inset-bottom), 22px);
  right: 28px;
  font-size: 10px; font-weight: 900; letter-spacing: 1px;
  font-family: monospace; color: var(--black);
  border-bottom: 2px solid var(--black); padding-bottom: 2px;
  cursor: pointer; z-index: 500; user-select: none;
  transition: color .15s, border-color .15s;
}
#reset:active { color: var(--red); border-color: var(--red); }
</style>
</head>
<body>

<div id="mask"><div id="dot"></div></div>
<div id="flash"></div>
<canvas id="cv"></canvas>

<div id="header" onclick="snapToday()">
  <div id="brand"><div id="led"></div>YOMI TIME</div>
  <div id="clock">00:00</div>
  <div id="sub"><div id="sec">:00</div><div id="ampm">--</div></div>
  <div id="meta">CALIBRATING…</div>
</div>

<div id="strip"></div>

<div id="view">
  <div id="v-title">—</div>
  <div id="v-body">—</div>
</div>

<div id="reset" onclick="snapToday()">RESET</div>

<script>
const DB = {
  "01-01":{ n:"元旦",    d:"时间的矢量在此处重置。",                      egg:"burst" },
  "01-15":{ n:"元宵节",  d:"正月十五，火树银花，千灯如昼。" },
  "02-14":{ n:"情人节",  d:"Valentine's Day." },
  "03-08":{ n:"妇女节",  d:"致敬所有女性。" },
  "03-21":{ n:"春分",    d:"昼夜等长，春和景明。" },
  "04-04":{ n:"清明",    d:"慎终追远，寒食祭祖。" },
  "04-22":{ n:"地球日",  d:"EARTH DAY. 珍视这颗蓝色星球。" },
  "05-01":{ n:"劳动节",  d:"致敬一切辛勤的劳动者。",                      egg:"burst" },
  "05-05":{ n:"立夏",    d:"夏季伊始，万物竞长。" },
  "06-01":{ n:"儿童节",  d:"愿所有人永葆赤子之心。" },
  "06-04":{ n:"",        d:"今日静默。",                                  isMourning:true },
  "06-21":{ n:"夏至",    d:"一年中白昼最长的一天。" },
  "07-07":{ n:"七夕",    d:"银汉迢迢暗渡。" },
  "08-08":{ n:"立秋",    d:"暑气渐消，金风送爽。" },
  "09-09":{ n:"重阳",    d:"登高望远，遥寄思念。" },
  "09-19":{ n:"摄影日",  d:"WORLD PHOTOGRAPHY DAY. 致敬定格瞬间的观察者。", egg:"flash" },
  "09-23":{ n:"秋分",    d:"金秋平分昼夜。" },
  "10-01":{ n:"国庆节",  d:"举国同庆，盛世繁荣。",                        egg:"burst" },
  "12-13":{ n:"",        d:"国家公祭日。铭记历史，守望和平。",             isMourning:true },
  "12-22":{ n:"冬至",    d:"一年中最长的夜，此后光明渐回。" },
  "12-25":{ n:"圣诞节",  d:"Merry Christmas." },
  "12-31":{ n:"跨年夜",  d:"另一段时间的序章即将开始。",                  egg:"burst" },
};

const MO = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const WK = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

const $ = id => document.getElementById(id);

function key(d) {
  return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* 启动 */
window.addEventListener('DOMContentLoaded', () => {
  const dot = $('dot'), mask = $('mask');
  setTimeout(() => dot.classList.add('pop'),   120);
  setTimeout(() => dot.classList.add('burst'), 500);
  setTimeout(() => { mask.classList.add('gone'); buildStrip(); tick(); }, 800);
});

/* 胶片条 */
function buildStrip() {
  const strip = $('strip');
  const today = new Date(); today.setHours(0,0,0,0);
  const frag  = document.createDocumentFragment();

  for (let i = -30; i <= 365; i++) {
    const d   = new Date(today); d.setDate(today.getDate() + i);
    const k   = key(d);
    const inf = DB[k] || null;
    const el  = document.createElement('div');
    el.className = 'frame' + (i === 0 ? ' today-frame' : '');

    if (inf?.isMourning) {
      el.innerHTML = `<div class="f-d">${d.getDate()}</div><div></div>`;
    } else {
      el.innerHTML =
        `<div><div class="f-m">${d.getMonth()+1}月</div><div class="f-d">${d.getDate()}</div></div>` +
        `<div><div class="f-w">${WK[d.getDay()]}</div><div class="f-e">${inf?.n||''}</div></div>`;
    }

    el.addEventListener('click', e => pick(el, d, inf, e));
    frag.appendChild(el);
  }
  strip.appendChild(frag);
  snapToday();
}

/* 选中 */
function pick(el, d, inf, e) {
  document.querySelectorAll('.frame.active').forEach(f => f.classList.remove('active'));
  el.classList.add('active');
  $('meta').textContent = `${d.getFullYear()} / ${MO[d.getMonth()]} / ${String(d.getDate()).padStart(2,'0')}`;
  document.body.classList.toggle('mourning', !!(inf?.isMourning));
  if (inf?.egg && e) fx(inf.egg, e);
  $('v-title').textContent = inf?.n  || 'REALTIME';
  $('v-body').textContent  = inf?.d  || '一切如常。未发现显著的时间异常。';
  navigator.vibrate?.(8);
}

/* 今日定位 */
function snapToday() {
  const strip = $('strip');
  const el    = document.querySelector('.today-frame');
  if (!el) return;
  strip.scrollTo({ left: el.offsetLeft - (innerWidth/2 - 40), behavior:'smooth' });
  const d = new Date(); d.setHours(0,0,0,0);
  pick(el, d, DB[key(d)] || null, null);
}

/* 时钟（对齐整秒） */
function tick() {
  (function loop() {
    const n = new Date();
    $('clock').textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
    $('sec').textContent   = ':' + String(n.getSeconds()).padStart(2,'0');
    $('ampm').textContent  = n.getHours() < 12 ? 'AM' : 'PM';
    setTimeout(loop, 1000 - n.getMilliseconds());
  })();
}

/* 特效 */
function fx(type, e) {
  if (type === 'flash') {
    const f = $('flash');
    f.style.transition = 'none';
    f.style.opacity = '0.9';
    requestAnimationFrame(() => { f.style.transition = 'opacity .32s ease-out'; f.style.opacity = '0'; });
    return;
  }
  const cv = $('cv'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const pts = Array.from({length:72}, (_,i) => {
    const a = Math.PI*2*i/72, s = Math.random()*7+3;
    return { x:e.clientX, y:e.clientY, vx:Math.cos(a)*s, vy:Math.sin(a)*s - Math.random()*2,
             life:1, dec:.011+Math.random()*.008, sz:Math.random()*2+1.5,
             col:Math.random()>.45?'#e30613':'#121212' };
  });
  (function loop() {
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;
    for (const p of pts) {
      if (p.life<=0) continue;
      alive=true; p.vx*=.976; p.vy+=.18; p.x+=p.vx; p.y+=p.vy; p.life-=p.dec;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x, p.y, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
    if (alive) requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
